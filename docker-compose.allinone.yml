# aigccat 单容器版 —— 给「只想快点跑起来」的人
#
# 一个容器 = 存储(MinIO) + 后端(web) + 鉴权(gateway) + AI 绑骨(opencode)
#            + Blender 5.2（减面 / 重拓扑 / 部件编辑 / 自动绑骨）
#            + 登录用的浏览器（Xvfb + Chromium + noVNC，网页里内嵌显示）。
# 首次启动自动生成密钥与初始账号，不用先配 .env。
# **宿主机上不需要装任何东西。**
#
# ⚠ 镜像有 amd64 / arm64 两个版本，Docker 会自动选。
#   amd64 版**自带 Blender 5.2**（减面/重拓扑/绑骨容器内直接可用）。
#   arm64 版不含 Blender —— Blender 官方只发布 Linux x64，没有 arm64 版，
#   所以这几个功能在 arm64 容器里不可用（其余功能不受影响）。
#   Apple Silicon 想用这些功能，用 amd64 的机器跑这个 compose 即可。
#
# 用法（二选一）：
#   1) 直接用预构建镜像（推荐，零编译）：
#        docker compose -f docker-compose.allinone.yml up -d
#   2) 从源码本地构建：
#        docker compose -f docker-compose.allinone.yml up -d --build
#
# 打开 http://localhost:8080 ；初始账号密码在首次启动的日志里（docker compose logs）。
#
# 可选：在仓库根目录建一个 .env，compose 会自动读取这些变量：
#   OPENAI_API_KEY / OPENAI_BASE_URL / OPENAI_MODEL   文字模型（生成计划、命名等）
#   TRIPO_API_KEY                                     Tripo API 建模（可选）
#   IMAGE_API_KEY / IMAGE_BASE_URL / IMAGE_MODEL     图片模型（可选）
#   AUTH_ORIGIN                                      用 HTTPS 反代暴露时的公开地址，
#                                                    如 https://aigccat.example.com
#   AIGCCAT_ADMIN_PASSWORD / MINIO_ROOT_PASSWORD     固定初始密码（不设则自动生成）
#
# 想换数据目录：把下面 volumes 的 aigccat-data 换成宿主路径，例如 ./aigccat-data:/data

# 显式项目名：与 docker-compose.yml（多容器版）用同一个目录名解析成不同项目，
# 避免有人在老部署上误跑 `docker compose up` 把正在跑的容器顶掉。
name: aigccat-allinone

services:
  aigccat:
    image: ghcr.io/rainnameless/aigccat:latest
    build:
      context: .
      dockerfile: deploy/allinone/Dockerfile
      args:
        # 从源码构建时，若 deb.debian.org 抽风（国内常见）可指定镜像源：
        #   APT_MIRROR=mirrors.ustc.edu.cn docker compose -f docker-compose.allinone.yml build
        # 留空则用官方源，对 CI / 海外用户无影响。
        APT_MIRROR: ${APT_MIRROR:-}
    ports:
      - "8080:8080"
    volumes:
      # 所有状态都在这一个卷里：对象存储、账号、配置、AI 任务
      # 备份 = 备份它；迁移 = 拷走它。
      - aigccat-data:/data
    environment:
      # 全部可选。留空则由容器首次启动时自动生成并持久化到 /data/aigccat.env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aigccat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      AIGCCAT_ADMIN_PASSWORD: ${AIGCCAT_ADMIN_PASSWORD:-}
      RIG_AGENT_TOKEN: ${RIG_AGENT_TOKEN:-}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-}
      # 生成能力（不配也能跑，只是生成类功能不可用）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TRIPO_API_KEY: ${TRIPO_API_KEY:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      # Studio 网页订阅：登录窗口（Xvfb + 浏览器 + noVNC）与执行器都在容器内，
      # 网页里内嵌显示，宿主机上不需要任何东西。这两个留空即可，容器会自己生成令牌。
      # 只在你想改用**外部**执行器时才设（例如自己另跑一个 8790）。
      STUDIO_WORKER_TOKEN: ${STUDIO_WORKER_TOKEN:-}
      STUDIO_WORKER_URL: ${STUDIO_WORKER_URL:-}
      # 访问被墙的上游时用的代理。容器内 127.0.0.1 不是宿主机，要写 host.docker.internal。
      # 留空则容器启动时自动探测 host.docker.internal:7897（Clash 默认端口）通不通。
      STUDIO_PROXY: ${STUDIO_PROXY:-}
      # Blender 工作器与绑骨桥默认用**容器内置**那份（留空即走内置 127.0.0.1）。
      # 只有想改用你自己宿主上的 Blender 时才设这两个（例如 http://host.docker.internal:8788）。
      BLENDER_WORKER_URL: ${BLENDER_WORKER_URL:-}
      RIG_HOST_URL: ${RIG_HOST_URL:-}
    extra_hosts:
      # Linux 上访问宿主机需要这行；Docker Desktop（macOS/Windows）自带
      - "host.docker.internal:host-gateway"
    # Blender 减面/重拓扑比较吃内存，给宽一点
    mem_limit: 4g
    restart: unless-stopped

volumes:
  aigccat-data: {}
