# Cloudflare terminates browser HTTPS; this origin uses HTTP as requested.
map $http_upgrade $aigccat_connection {
    default upgrade;
    '' close;
}
# Normalize only this exact public Origin to the backend HTTP transport.
map $http_origin $aigccat_origin {
    default $http_origin;
    "https://<your-domain>" "http://<your-domain>";
}
server {
    listen 80;
    listen [::]:80;
    server_name <your-domain>;
    include /etc/nginx/aigccat-cloudflare-allow.conf;
    auth_basic "aigccat private workspace";
    auth_basic_user_file /etc/nginx/aigccat.htpasswd;
    client_max_body_size 768m;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # CF-Visitor is accepted only behind the Cloudflare IP allowlist.
    if ($http_cf_visitor !~ '"scheme":"https"') {
        return 301 https://<your-domain>$request_uri;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host <your-domain>;
        proxy_set_header Origin $aigccat_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aigccat_connection;
        # Basic auth terminates here; do not send the workspace password to Rust.
        proxy_set_header Authorization "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_hide_header Cache-Control;
    }
}
