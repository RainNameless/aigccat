# Browser HTTPS terminates at Cloudflare; the existing SSH tunnel serves app files.
map $http_upgrade $aigccat_connection { default upgrade; '' close; }
map $http_origin $aigccat_origin { default $http_origin; "https://<your-domain>" "http://<your-domain>"; }
server {
    listen 80;
    listen [::]:80;
    server_name <your-domain>;
    include /etc/nginx/aigccat-cloudflare-allow.conf;
    client_max_body_size 768m;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    if ($http_cf_visitor !~ '"scheme":"https"') { return 301 https://<your-domain>$request_uri; }
    location = /_aigccat_auth {
        internal;
        proxy_pass http://127.0.0.1:18081/internal/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include /etc/nginx/snippets/aigccat-auth-secret.conf;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-Origin $http_origin;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header Cookie $http_cookie;
    }
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/snippets/aigccat-auth-secret.conf;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header Authorization "";
    }
    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/snippets/aigccat-auth-secret.conf;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header Authorization "";
    }
    location ~ ^/(login\.html|login\.js|auth\.css|shell\.css)$ {
        include /etc/nginx/snippets/aigccat-app-proxy.conf;
    }
    location /api/ {
        auth_request /_aigccat_auth;
        error_page 401 = @api_unauthorized;
        error_page 403 = @api_forbidden;
        include /etc/nginx/snippets/aigccat-app-proxy.conf;
    }
    location / {
        auth_request /_aigccat_auth;
        error_page 401 = @login;
        include /etc/nginx/snippets/aigccat-app-proxy.conf;
    }
    location @login { return 302 /login.html?next=$request_uri; }
    location @api_unauthorized { default_type application/json; return 401 '{"error":"请先登录"}'; }
    location @api_forbidden { default_type application/json; return 403 '{"error":"没有权限执行此操作"}'; }
}
