# aigccat unified gateway: local, LAN and public all authenticate on Mac.
server {
    listen 80;
    listen [::]:80;
    server_name <your-domain>;
    include /etc/nginx/aigccat-cloudflare-allow.conf;
    client_max_body_size 768m;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    if ($http_cf_visitor !~ '"scheme":"https"') { return 301 https://<your-domain>$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host <your-domain>;
        proxy_set_header Origin $http_origin;
        include /etc/nginx/snippets/aigccat-auth-secret.conf;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_hide_header Cache-Control;
    }
}
