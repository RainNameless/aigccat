<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型与服务 · aigccat</title><script>if(window.top===window.self)location.replace("/admin.html#accounts");</script>
<link rel="stylesheet" href="/shell.css?v=13"><link rel="stylesheet" href="/model-chat.css?v=2"><script src="/vendor/lucide.min.js" defer></script><script src="/shell.js?v=14"></script></head>
<body><header><a class="brand" href="/">aigccat</a><nav aria-label="主导航"><a href="/library.html">资产库</a><a href="/admin.html#accounts">设置</a></nav></header>
<main class="chat-app"><div class="chat-heading"><div><h1>模型对话</h1><p>选一个模型，直接试试文字或图片。每条消息独立测试。</p></div><a href="/#tool=model" target="_top">3D 模型生成</a></div>
<div class="chat-controls"><label for="chat-model">测试模型</label><select id="chat-model" disabled aria-label="测试模型"><option>正在读取模型…</option></select><button id="refresh-models" type="button">刷新</button><button id="clear-chat" type="button">清空记录</button><a href="/admin.html#accounts" style="font-size:13px">模型与账号设置 →</a></div>
<p id="chat-notice" role="status"></p>
<section id="chat-log" role="log" aria-label="测试对话" aria-live="polite"></section>
<form id="chat-form"><label class="sr-only" for="chat-prompt">消息或图片描述</label><textarea id="chat-prompt" placeholder="描述想生成的图片，或输入问题…" maxlength="10000" rows="3" required></textarea><div class="composer-bottom"><span>发送会调用已保存的服务，按供应商计费。Shift + Enter 换行。</span><button id="chat-send" type="submit" disabled>发送</button></div></form>
<dialog id="image-dialog"><button id="close-image" type="button" aria-label="关闭图片">关闭</button><img alt="生成图片原图" id="large-image"></dialog>
</main><script type="module" src="/model-chat.js?v=4"></script></body></html>
