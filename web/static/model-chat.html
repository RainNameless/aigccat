<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型与服务 · aigccat</title><script>if(window.top===window.self)location.replace("/admin.html#models");</script>
<link rel="stylesheet" href="/shell.css?v=13"><link rel="stylesheet" href="/model-chat.css?v=2"><script src="/vendor/lucide.min.js" defer></script><script src="/shell.js?v=13"></script></head>
<body><header><a class="brand" href="/">aigccat</a><nav aria-label="主导航"><a href="/library.html">资产库</a><a href="/admin.html#models">设置</a></nav></header>
<main class="chat-app"><div class="chat-heading"><div><h1>模型对话</h1><p>选一个模型，直接试试文字或图片。每条消息独立测试。</p></div><a href="/#tool=model" target="_top">3D 模型生成</a></div>
<div class="chat-controls"><label for="chat-model">测试模型</label><select id="chat-model" disabled aria-label="测试模型"><option>正在读取模型…</option></select><button id="manage-models" type="button">模型开关与配置</button><button id="creation-settings" type="button">首页创作设置</button><button id="refresh-models" type="button">刷新</button><button id="clear-chat" type="button">清空记录</button></div>
<p id="chat-notice" role="status"></p>
<section id="chat-log" role="log" aria-label="测试对话" aria-live="polite"></section>
<form id="chat-form"><label class="sr-only" for="chat-prompt">消息或图片描述</label><textarea id="chat-prompt" placeholder="描述想生成的图片，或输入问题…" maxlength="10000" rows="3" required></textarea><div class="composer-bottom"><span>发送会调用已保存的服务，按供应商计费。Shift + Enter 换行。</span><button id="chat-send" type="submit" disabled>发送</button></div></form>
<dialog id="image-dialog"><button id="close-image" type="button" aria-label="关闭图片">关闭</button><img alt="生成图片原图" id="large-image"></dialog>
<dialog id="manager"><div class="manager-heading"><div><h2>模型配置管理</h2><p>同一接入只配一次地址和 Key，多个模型共用。</p></div><button id="close-manager" type="button">关闭</button></div><div class="manager-actions"><button id="add-provider" type="button">＋ 添加接入</button><button id="add-model" type="button">＋ 添加模型</button><button id="import-models" type="button">读取接入模型</button></div><p id="manager-notice" role="status"></p><div class="manager-layout"><div class="model-browser"><input id="model-search" type="search" placeholder="搜索模型或接入…" aria-label="搜索模型或接入"><div id="model-list"></div></div><form id="config-editor"><p>点击模型或接入进行配置。</p></form></div><div class="manager-footer"><span>默认模型用于首页创作；测试选择不改变默认模型。</span><button id="save-catalog" type="button">保存全部配置</button></div></dialog>
</main><script type="module" src="/model-chat.js?v=3"></script><script type="module" src="/model-manager.js?v=2"></script><script type="module" src="/creation-settings.js?v=1"></script></body></html>
