function persistWatch() {
  try {
    const active = [...jobWatch.entries()]
      .filter(([, w]) => ACTIVE_JOB.includes(String(w.status)))
      .map(([key, w]) => ({ key, dir: w.dir, id: w.id, status: w.status, startedAt: w.startedAt }));
    localStorage.setItem(WATCH_STORE, JSON.stringify(active));
  } catch {}
}
function restoreWatch() {
  try {

        { dir: w.dir, id: w.id, status: w.status || 'running', jobId: null, startedAt: w.startedAt, error: '' });
    }
  } catch {}
}

        c.onclick = e => { if(e.target.type !== 'checkbox') location.hash = `#${c.dataset.dir}/${c.dataset.id}`; };
        c.onkeydown = e => { if(e.key==='Enter' && e.target===c) c.click(); };
      });
      document.querySelectorAll('.ck').forEach(c=>c.onchange=()=>updateBar());
      updateBar(); return;
    }
    $('list').innerHTML = list.map(a => {
      const d = DIR_OF[a.asset_type] || '';
      const busy = isActiveJob(jobWatch.get(watchKey(d, a.asset_id)));
      const pv = a.preview
        ? `<img src="/api/assets/${d}/${a.asset_id}/file/${a.preview}" loading="lazy"
            style="width:56px; height:56px; object-fit:contain; border-radius:8px; background:#0b1120">`
        : '<div class="muted">—</div>';
      return `<tr style="cursor:pointer" data-dir="${esc(d)}" data-id="${esc(a.asset_id)}">
        <td><input type="checkbox" class="ck" ${selected.has(assetRef(a))?'checked':''} data-ref="${esc(d)}/${esc(a.asset_id)}" data-ver="${esc(a.version ?? '')}"></td>
        <td>${pv}</td>
        <td class="stat">${esc(numberOf(a))}</td><td>${esc(displayName(a))} <button class="sm ghost" data-delete-asset="${esc(d)}/${esc(a.asset_id)}">${showTrash?'恢复':'删除'}</button></td>
        <td><span class="badge">${esc(category(a.asset_type))}</span></td>
        <td><span class="badge st">${esc(assetStatusText(a))}</span>${busy ? ' <span class="badge busy">参考图处理中</span>' : ''}</td><td class="muted">${a.version ?? '—'}</td></tr>`;}).join('')
      || '<tr><td colspan="7" class="muted">没有匹配的资产</td></tr>';
    document.querySelectorAll('.ck').forEach(c => c.onchange = () => {
      updateBar();
      window.__aigccat_selection = [...document.querySelectorAll('.ck:checked')].map(x => {
        const [dir, id] = x.dataset.ref.split('/');
        return { dir, id, version: x.dataset.ver };
      });
    });
    $('list').querySelectorAll('tr[data-id]').forEach(tr =>
      tr.onclick = e => { if (e.target.type !== 'checkbox') location.hash = `#${tr.dataset.dir}/${tr.dataset.id}`; });
    updateBar();
  }
  function updateBar() {
    const n = [...document.querySelectorAll('.ck:checked')].length;
    $('batchbar').style.display = n ? 'flex' : 'none';
    $('selcount').textContent = `已选 ${n}`;
    const total=document.querySelectorAll('.ck').length;
    $('ckall').checked = total>0 && n===total;
    $('ckall').indeterminate = n>0 && n<total;
  };
  await renderList();
  $('list').querySelectorAll('tr[data-id]').forEach(tr =>
    tr.onclick = e => { if (e.target.type !== 'checkbox') location.hash = `#${tr.dataset.dir}/${tr.dataset.id}`; });
  document.querySelectorAll('.ck').forEach(c => c.onchange = updateBar);
  $('ckall').onchange = e => { document.querySelectorAll('.ck').forEach(c => c.checked = e.target.checked); updateBar(); };
  $('batchgo').onclick = async () => {
    const assets = [...document.querySelectorAll('.ck:checked')].map(c => c.dataset.ref);
    const op = $('batchop').value;
    if (!assets.length) return;
    if (!confirm(`确认对 ${assets.length} 个资产执行「${$('batchop').selectedOptions[0].textContent}」？生成操作可能消耗额度，发布和回滚会改变资产状态。`)) return;
    const body = { op, assets };
    if (op === 'global_style_apply') body.style = (await api('/api/styleprofile')).style_keywords || '';
    $('batchmsg').textContent = `正在执行${$('batchop').selectedOptions[0].textContent}（${assets.length} 个）…`;
    try {
      const d = await api('/api/batch', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
      $('batchmsg').textContent = `已完成：${d.ok}/${d.total} 成功，具体任务信息请在资产详情的后台任务中查看。`;
      refreshLedger();
      settingsGuide($('batchmsg'), $('batchmsg').textContent);
    } catch (e) { $('batchmsg').textContent = '✘ ' + e.message; settingsGuide($('batchmsg'), e.message); }
  };
  // ---------- 生成任务关注（只读核对，10 秒一次，离开本页停止） ----------
  function renderRunBar() {
    if (!alive() || !$('runbar')) return;
    const keys = [...jobWatch.keys()];
    if (!keys.length) { $('runbar').style.display = 'none'; stopLibraryWatch(); return; }
    $('runbar').style.display = 'block';
    $('runbar-list').innerHTML = keys.map(key => {
      const w = jobWatch.get(key);
      if (!w) return '';
      const link = `<a class="back" href="#${esc(w.dir || '')}/${esc(w.id)}">${esc(w.id)}</a>`;
      if (ACTIVE_JOB.includes(String(w.status))) {
        const prog = w.progress ? ` · 进度 ${esc(String(w.progress.completed_views ?? 0))}/${esc(String(w.progress.total_views ?? 3))}` : '';
        return `<div class="rw-row"><span class="badge busy">处理中</span>${link}
          <span>参考图生成中 · <span data-elapsed="${esc(key)}">已等待 ${esc(elapsedText(w.startedAt))}</span>${prog}</span></div>`;
      }
      const failed = String(w.status) === 'failed';
      return `<div class="rw-row"><span class="badge ${failed ? 'pub' : 'st'}">${failed ? '失败' : '已完成'}</span>${link}
        <span>参考图生成${failed ? '失败' : '已完成'}${failed && w.error ? '：' + esc(w.error) : ''}</span>
        <button class="sm ghost" data-close="${esc(key)}">知道了</button></div>`;
    }).join('');
    $('runbar-list').querySelectorAll('[data-close]').forEach(b =>
      b.onclick = () => { dropWatch(b.dataset.close); renderRunBar(); });
  }
  function tickRunBar() {
    if (!alive() || !$('runbar')) return;
    $('runbar').querySelectorAll('[data-elapsed]').forEach(el => {
      const w = jobWatch.get(el.dataset.elapsed);
      if (w) el.textContent = '已等待 ' + elapsedText(w.startedAt);
    });
  }
  async function refreshRunBar() {
    if (!alive()) return;
    if (!jobWatch.size) { renderRunBar(); return; }
    let ended = false;
    for (const [key, w] of [...jobWatch]) {
      if (!alive()) return;
      try {
        const { records } = await loadJobRecords(w.dir, w.id);
        if (!alive()) return;
        const ref = latestRefJob(records);
        if (isActiveJob(ref)) {
          setWatch(key, { ...w, status: ref.status, jobId: ref.job_id ?? w.jobId,
            startedAt: jobStartedAt(ref) || w.startedAt, error: '', progress: ref.progress ?? null });
        } else {
          if (ACTIVE_JOB.includes(String(w.status))) ended = true;
          setWatch(key, { ...w, status: ref ? ref.status : 'done', jobId: ref?.job_id ?? w.jobId,
            startedAt: ref ? (jobStartedAt(ref) || w.startedAt) : w.startedAt,
            error: ref?.error ?? '', progress: ref?.progress ?? null });
        }
      } catch { /* 读取失败：保留上次状态，下一轮继续核对 */ }
    }
    if (!alive()) return;
    renderRunBar();
    if (ended) {
      try {
        allAssets = (await api('/api/assets')).assets || [];
        if (!alive()) return;
        tax = await api('/api/taxonomy');
        if (!alive()) return;
        fillStatuses($('status-filter').value); drawTypes(); drawSub(); renderList();
      } catch {}
    }
    if (!hasActiveWatch()) stopLibraryWatch();
  }
  function startLibraryWatch() {
    if (libPollTimer || libTickTimer) return;
    libPollTimer = setInterval(() => { if (alive() && !document.hidden) refreshRunBar().catch(()=>{}); }, 10000);
    libTickTimer = setInterval(() => { if (alive() && !document.hidden) tickRunBar(); }, 1000);
  }
  renderRunBar();
  if (hasActiveWatch()) startLibraryWatch();
}

// ---------- Three.js 工具 ----------
const { viewers, createViewer, disposeViewer, disposeViewers, loadInto, camFor } = viewerTools(modelBounds, fitCamera);
const VIEW_DIRECTIONS = { front: [0, 0, 1], side: [1, 0, 0], back: [0, 0, -1], '34': [0.7, 0.5, 0.7] };
function modelBounds(obj) {
  obj.updateMatrixWorld(true);
  obj.traverse(mesh => {
    if (mesh.isSkinnedMesh) {
      mesh.skeleton?.update();
      mesh.computeBoundingBox();
      mesh.computeBoundingSphere();
    }
  });
  const box = new THREE.Box3().setFromObject(obj, true);
  if (box.isEmpty()) throw new Error('模型没有可取景的几何体');
  return box;
}
function fitCamera(camera, box, direction, controls = null, sharedDistance = 0) {
  const center = box.getCenter(new THREE.Vector3());
  const span = Math.max(box.getSize(new THREE.Vector3()).length(), 1e-6);
  const backward = direction.clone().normalize();
  const right = new THREE.Vector3().crossVectors(camera.up, backward);
  if (right.lengthSq() < 1e-10) right.set(1, 0, 0);
  right.normalize();
  const up = new THREE.Vector3().crossVectors(backward, right).normalize();
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.getEffectiveFOV()) / 2);
  const tanH = tanV * camera.aspect;
  const corners = [];
  let distance = sharedDistance;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const p = new THREE.Vector3(x, y, z).sub(center);
    const depth = p.dot(backward);
    corners.push(depth);
    distance = Math.max(distance, depth + 1.12 * Math.abs(p.dot(right)) / tanH,
      depth + 1.12 * Math.abs(p.dot(up)) / tanV, depth + span * 0.01);
  }
  camera.position.copy(center).addScaledVector(backward, distance);
  camera.lookAt(center);
  const depths = corners.map(z => distance - z);
  camera.near = Math.max(span * 1e-6, Math.min(...depths) * 0.5);
  camera.far = Math.max(...depths) + span;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  if (controls) {
    const autoRotate = controls.autoRotate, damping = controls.enableDamping;
    controls.autoRotate = false;
    controls.enableDamping = false;
    controls.target.copy(center);
    controls.maxDistance = span * 20;
    controls.minDistance = span * 0.03;
    controls.update();
    controls.autoRotate = autoRotate;
    controls.enableDamping = damping;
  }
  return distance;
}
function captureViews(v, presets) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  const camera = new THREE.PerspectiveCamera(45, 720 / 900, 0.01, 100);
  const gridVisible = v.grid.visible;
  const oldEnvironment = v.scene.environment;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const room = new RoomEnvironment();
  const environment = pmrem.fromScene(room, 0.04);
  room.dispose();
  try {
    // PMREM 需在截图 renderer 的 WebGL 上下文重新生成。
    v.scene.environment = environment.texture;
    renderer.setPixelRatio(1);
    renderer.setSize(720, 900, false);
    renderer.outputColorSpace = v.renderer.outputColorSpace;
    renderer.toneMapping = v.renderer.toneMapping;
    renderer.toneMappingExposure = v.renderer.toneMappingExposure;
    const box = modelBounds(v.obj);
    const directions = presets.map(p => {
      const direction = new THREE.Vector3(...VIEW_DIRECTIONS[p]);
      if (v.planFrontNegativeZ) direction.applyAxisAngle(new THREE.Vector3(0,1,0), Math.PI);
      return direction;
    });
    // 所有视角采用同一距离和视场角，统一尺度并容纳最宽的视角。
    const distance = Math.max(...directions.map(direction => fitCamera(camera, box, direction)));
    v.grid.visible = false;
    // 同步完成截图后恢复场景；不等待动画帧，不触碰交互相机或控制器。
    return presets.map((preset, i) => {
      fitCamera(camera, box, directions[i], null, distance);
      renderer.render(v.scene, camera);
      return { preset, data_b64: renderer.domElement.toDataURL('image/png').split(',')[1] };
    });
  } finally {
    v.grid.visible = gridVisible;
    v.scene.environment = oldEnvironment;
    environment.dispose();
    pmrem.dispose();
    renderer.dispose();
    renderer.forceContextLoss();
  }
}

// ---------- 路由 ----------
async function pageImages() {
  disposeViewers();
  const epoch = detailEpoch;
  app.innerHTML = '<section class="workspace-head"><h2>图片资源</h2><a href="/#new=1&tool=image">创作图片</a></section><div class="ops"><a href="/library.html">模型资产</a><input id="media-search" type="search" aria-label="搜索图片资源" placeholder="搜索所属资产"><span>每个资产仅展示一组四视图 · 下载原图</span></div><div id="media-list" class="media-grid">加载图片资源…</div>';
  const [media, assets, state] = await Promise.all([api('/api/media/images'),api('/api/assets'),api('/api/workbench/state')]);
  if (epoch !== detailEpoch) return;
  const names = new Map(assets.assets.map(a => [DIR_OF[a.asset_type]+'/'+a.asset_id,a.name]));
  const grouped=new Map();
  for(const item of media.images){if((state.archived||[]).includes(item.asset)||!names.has(item.asset))continue;if(!grouped.has(item.asset))grouped.set(item.asset,[]);grouped.get(item.asset).push(item);}
  const visible=[...grouped.values()].flatMap(assetImages);
  const render = () => {
    const query = $('media-search').value.trim().toLowerCase();
    $('media-list').innerHTML = visible.filter(i => !query || (names.get(i.asset)||i.asset).toLowerCase().includes(query)).map(i => {
      const url = '/api/assets/'+i.asset+'/file/'+i.path;
      const href = '/#'+new URLSearchParams({asset:i.asset,tool:'image'});
      return `<figure><a href="${esc(href)}"><img loading="lazy" src="${esc(url)}" alt="${esc(names.get(i.asset)||i.asset)}"></a><figcaption><strong>${esc(names.get(i.asset)||i.asset)}</strong><span>${({front:'正面',back:'背面',side:'左侧',right:'右侧'})[imageView(i)]||'图片'}</span><a href="${esc(url)}" download title="下载图片">下载</a></figcaption></figure>`;
    }).join('') || '<p>暂无匹配图片</p>';
  };
  $('media-search').oninput = render; render();
}

async function route() {
  ++detailEpoch; detailCleanup(); detailCleanup=()=>{};
  refreshLedger();
  const h = location.hash.slice(1);
  const m = h.match(/^([a-z]+)\/(.+)$/);
  try {
    if (h === 'canvas') {
      disposeViewers();
      await mountCanvas({ host: app, api, DIR_OF, THREE, GLTFLoader, OrbitControls, RoomEnvironment, modelBounds, fitCamera });
    } else if (h === 'images') await pageImages();
    else if (m && Object.values(DIR_OF).includes(m[1])) location.replace('/#' + new URLSearchParams({asset:m[1]+'/'+m[2],tool:'model'}));
    else { disposeViewers(); await pageLibrary(); }
  } catch (e) {
    const error = document.createElement('div'); error.className = 'card fail';
    error.textContent = '加载失败：' + e.message; settingsGuide(error, e.message);
    app.replaceChildren(error);
  }
}
addEventListener('hashchange', route);
route();
