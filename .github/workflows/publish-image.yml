name: publish all-in-one image

# 把单容器镜像构建好推到 GitHub Container Registry，
# 这样别人不用在本地编译 Rust、也不用拉基础镜像，一条 docker run 就能跑。
#
# 产物：ghcr.io/rainnameless/aigccat:latest          —— 跟随 main 最新
#       ghcr.io/rainnameless/aigccat:sha-<短提交>   —— 固定版本，可复现
#       ghcr.io/rainnameless/aigccat:<git tag>      —— 打 tag 时
#
# 只构建 amd64：官方 Blender 仅提供 Linux x64，amd64 镜像可以把 Blender 5.2 打包进容器
# （减面 / 重拓扑 / 部件编辑 / 自动绑骨开箱可用）；arm64 没有对应的 Blender 构建，
# 而本项目的部署目标是 x86 服务器，因此只发布 amd64，不额外维护 arm64 构建链。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rainnameless/aigccat

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/allinone/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image manifest
        working-directory: /tmp/digests
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAGS="-t ${IMAGE}:sha-${SHORT_SHA}"
          # main → 同时打 :latest；打 tag → 额外打 tag 名
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAGS="${TAGS} -t ${IMAGE}:latest"; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAGS="${TAGS} -t ${IMAGE}:${GITHUB_REF_NAME}"; fi
          docker buildx imagetools create ${TAGS} \
            $(printf "${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ env.IMAGE }}

      - name: Show result
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest
