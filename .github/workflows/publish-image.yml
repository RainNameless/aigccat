name: publish all-in-one image

# 把单容器镜像构建好推到 GitHub Container Registry，
# 这样别人不用在本地编译 Rust、也不用拉基础镜像，一条 docker run 就能跑。
#
# 产物：ghcr.io/rainnameless/aigccat:latest          —— 跟随 main 最新
#       ghcr.io/rainnameless/aigccat:sha-<短提交>   —— 固定版本，可复现
#       ghcr.io/rainnameless/aigccat:<git tag>      —— 打 tag 时
#
# amd64 与 arm64 各自在原生 runner 上构建后合并成一个多架构 manifest，
# 不用 QEMU 模拟（opencode-ai 装的是原生二进制，模拟构建容易失败且极慢）。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rainnameless/aigccat

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # 公开仓库可用的 arm64 原生 runner；若你的仓库不可用，删掉这一项即可
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/allinone/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAGS="-t ${IMAGE}:latest -t ${IMAGE}:sha-${SHORT_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAGS="${TAGS} -t ${IMAGE}:${GITHUB_REF_NAME}"; fi
          docker buildx imagetools create ${TAGS} \
            $(printf "${IMAGE}@sha256:%s " *)
        env:
          IMAGE: ${{ env.IMAGE }}

      - name: Show result
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest
