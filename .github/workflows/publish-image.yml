name: publish all-in-one image

# 把单容器镜像构建好推到 GitHub Container Registry，
# 这样别人不用在本地编译 Rust、也不用拉基础镜像，一条 docker run 就能跑。
#
# 产物：ghcr.io/rainnameless/aigccat:latest          —— 跟随 main 最新
#       ghcr.io/rainnameless/aigccat:sha-<短提交>   —— 固定版本，可复现
#       ghcr.io/rainnameless/aigccat:<git tag>      —— 打 tag 时
#
# ⚠ 只构建 linux/amd64。镜像里含 Blender 5.2，而 Blender 官方只发布 Linux x64，
#   没有 linux-arm64（实测 arm64 包 404，4.5 全系同样只有 x64）。
#   Apple Silicon 由 Docker Desktop 的 Rosetta 运行这个 amd64 镜像，功能一致
#   （实测容器内 decimate 45s / remesh 18s / rig 20s）。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rainnameless/aigccat

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/allinone/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show result
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest
